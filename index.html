<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nostalgia Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="player">
<div class="title">NOSTALGIA PLAYER v2.003</div>
<div class="display">
<div id="time">00:00</div>
<marquee id="song">Linkin Park - Numb</marquee>
<canvas id="viz" width="420" height="70"></canvas>
<input id="progress" type="range" min="0" max="100" value="0">
</div>
<div class="controls">
<button id="prev">⏮</button>
<button id="play">▶</button>
<button id="pause">⏸</button>
<button id="stop">⏹</button>
<button id="next">⏭</button>
</div>
<label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="1"></label>
<div class="playlist">
<div class="track active" data-src="music/numb.mp3">Linkin Park - Numb</div>
<div class="track" data-src="music/change.mp3">Deftones - Change</div>
<div class="track" data-src="music/nosurprises.mp3">Radiohead - No Surprises</div>
</div>
<audio id="audio"></audio>
</div>
<script src="script.js"></script>
</body></html>
